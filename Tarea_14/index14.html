<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <meta name="author" content="Alicia yaneli lopez pascual">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header id="encabezado">
    <section class="logo">
        <img src="imagenes/logo.jpg" alt="logo">
    </section>
    <h1>CSS GRID</h1>
    <nav id="navegacion">
        <ul>
            <li><a href="#">Link 1</a></li>
            <li><a href="#">Link 2</a></li>
            <li><a href="#">Link 3</a></li>
        </ul>
    </nav>
</header>


<main id="contenedor-grid">
    <section class="gato1">
        <img src="imagenes/imagen1.jpeg" alt="gato1">
    </section>
    <section class="gato2">
        <img src="imagenes/imagen2.jpeg" alt="gato2">
    </section>
    <section class="gato3">
        <img src="imagenes/imagen3.png" alt="gato3">
    </section>
    <section class="gato4">
        <img src="imagenes/imagen4.jpg" alt="gato4">
    </section>
</main>

<section class="contenedor-grid2">
    <section class="gato1-2">
        <img src="imagenes/imagen1.jpeg" alt="gato1">
    </section>
    <section class="gato2-2">
        <img src="imagenes/imagen2.jpeg" alt="gato2">
    </section>
    <section class="gato3-2">
        <img src="imagenes/imagen3.png" alt="gato3">
    </section>
</section>
</body>
</html>
